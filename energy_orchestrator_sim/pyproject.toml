[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-orchestrator-sim"
version = "1.0.0"
description = "Production-grade UK residential energy simulation & optimization engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Richard T. Martin", email = "richard@example.com"}
]
keywords = [
    "energy",
    "optimization",
    "simulation",
    "uk-power-systems",
    "battery-storage",
    "ev-charging",
    "demand-response"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "ortools>=9.7.0",
    "streamlit>=1.30.0",
    "plotly>=5.17.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.1",
    "ruff>=0.1.5",
    "mypy>=1.5.1"
]
docs = [
    "sphinx>=7.2.0",
    "myst-parser>=2.0.0",
    "sphinx-rtd-theme>=1.3.0"
]

[project.urls]
Homepage = "https://github.com/yourusername/energy-orchestrator"
Documentation = "https://energy-orchestrator.readthedocs.io"
Repository = "https://github.com/yourusername/energy-orchestrator"

[tool.setuptools]
packages = ["energy_orchestrator_sim"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
